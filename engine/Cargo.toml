[workspace]
members = [
    "crates/tensor-core",
    "crates/model",
    "crates/kv-cache",
    "crates/scheduler",
    "crates/server",
]
resolver = "2"

# Tüm crate'ler versiyonları buradan alır: `candle-core = { workspace = true }`
[workspace.dependencies]
# Tensor / model motoru
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
safetensors = "0.8.0"
tokenizers = "0.23.2"

# Yardımcılar
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# İç crate'ler (path dependency)
tensor-core = { path = "crates/tensor-core" }
model = { path = "crates/model" }
kv-cache = { path = "crates/kv-cache" }
scheduler = { path = "crates/scheduler" }
